[tool.poetry]
name = "younhalibrary"
package-mode = false
version = "0.1.0"
description = "Younha Library of photos and videos"
authors = ["Joonhyung Shin <joon46551@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "younhalibrary"}]

[tool.poetry.dependencies]
python = "^3.9"
django = "^4.2.15"
gunicorn = "^20.1.0"
djangorestframework = "^3.15.2"
django-filter = "^22.1"
psycopg = {extras = ["c"], version = "^3.2.1"}
whitenoise = "^6.7.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
